services:
  - type: web
    name: nani-ai-assistant
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements-light.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      # Render generates a strong secret. Copy it from the Render Environment
      # page when you want to open /admin.
      - key: ADMIN_TOKEN
        generateValue: true
      # Render prompts for this secret during first-time Blueprint creation.
      # Leave it blank only when you intentionally want local-only answers.
      - key: LLM_API_KEY
        sync: false
      # Free instances have ephemeral storage. Use a Render disk/managed DB if
      # conversation analytics must survive redeploys or restarts.
      - key: DB_PATH
        value: /tmp/data/nani.db
      - key: BOT_NAME
        value: Nani
      - key: BOT_TAGLINE
        value: Your thoughtful AI assistant
